# Managed by Commit Aquarium
name: Notify aquarium on push
on:
  push:
    branches: ["main"]
permissions: {}
concurrency:
  group: notify-aquarium-${{ github.ref }}
  cancel-in-progress: true
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refresh aquarium
        env:
          GH_TOKEN: ${{ secrets.AQUARIUM_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::AQUARIUM_DISPATCH_TOKEN is not configured.'
            exit 1
          fi
          gh workflow run aquarium.yml --repo juri-lee54/commit-aquarium --ref main
